# ld65 linker config: 32KB LoROM SNES cartridge
MEMORY {
    ZP:   start = $0000, size = $0100;
    WRAM: start = $0200, size = $1E00;
    ROM:  start = $8000, size = $8000, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = WRAM, type = bss;
    CODE:     load = ROM,  type = ro;
    RODATA:   load = ROM,  type = ro;
    HEADER:   load = ROM,  type = ro, start = $FFC0;
    VECTORS:  load = ROM,  type = ro, start = $FFE0;
}
